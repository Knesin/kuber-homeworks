apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: strip-api
spec:
  stripPrefix:
    prefixes:
      - /api
---
apiVersion: v1
kind: Service
metadata:
  name: web-app
spec:
  selector:
    app: web-app
  ports:
    - name: http-nginx
      protocol: TCP
      port: 80
      targetPort: 80
    - name: https-nginx
      protocol: TCP
      port: 443
      targetPort: 443
    - name: http-multitool
      protocol: TCP
      port: 8080
      targetPort: 8080
    - name: https-multitool
      protocol: TCP
      port: 8443
      targetPort: 8443
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: my-ingress
  annotations:
    traefik.ingress.kubernetes.io/router.middlewares: default-strip-api@kubernetescrd
spec:
  tls:
  - hosts:
    - nginx-multitool.site
    secretName: tls-secret
  rules:
  - host: nginx-multitool.site
    http:
      paths:
      - path: /api
        pathType: Prefix
        backend:
          service:
            name: web-app
            port: 
              number: 8443
      - path: /
        pathType: Prefix
        backend:
          service:
            name: web-app
            port: 
              number: 443
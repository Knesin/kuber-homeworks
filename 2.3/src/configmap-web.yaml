apiVersion: v1
kind: ConfigMap
metadata:
  name: web-content
  namespace: default
data:
  index.html: |
    <!DOCTYPE html>
    <html>
    <head>
      <title>Страница из ConfigMap</title> # ИЗМЕНИТЕ: Заголовок страницы
    </head>
    <body>
      <h1>Привет от Kubernetes!</h1> # ДОБАВЬТЕ: Свой контент страницы
    </body>
    </html>
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: env-multitool
  namespace: default
data:
  HTTP_PORT: "8080"
  HTTPS_PORT: "8443"

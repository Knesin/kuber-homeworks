frontend:
  replicas: 1
  image:
    repository: nginx
    tag: "1.14.2"
  port: 80
  target_port: 80
  name_port: http-nginx

backend:
  replicas: 1
  image:
    repository: wbitt/network-multitool
    tag: "alpine-extra"
  port: 8080
  target_port: 8080
  name_port: http-multitool

ingress:
  host: nginx-multitool.site
  backend_prefix: /api
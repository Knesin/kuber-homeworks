apiVersion: apps/v1
kind: Deployment
metadata:
  name: data-exchange
spec:
  replicas: 1
  selector:
    matchLabels:
      app: busybox-multitool
  template:
    metadata:
      labels:
        app: busybox-multitool
    spec:
      containers:
      - name: busybox
        image: busybox
        command: ["/bin/sh", "-c"] 
        args: ["while true; do echo $(date) >> /date/out/file.txt; sleep 5; done"] 
        volumeMounts:
        - name: my-volumes
          mountPath: /date/out
      - name: multitool
        image: wbitt/network-multitool:alpine-extra
        command: ["/bin/sh", "-c"]
        args: ["tail -f /date/in/file.txt"]
        volumeMounts:
        - name: my-volumes
          mountPath: /date/in/
      volumes:
      - name: my-volumes
        emptyDir: {}
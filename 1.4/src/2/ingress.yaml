apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: strip-api
spec:
  stripPrefix:
    prefixes:
      - /api
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: my-ingress
  annotations:
    traefik.ingress.kubernetes.io/router.middlewares: default-strip-api@kubernetescrd
spec:
  rules:
  - host: nginx-multitool.site
    http:
      paths:
      - path: /api
        pathType: Prefix
        backend:
          service:
            name: api-multitool-service
            port: 
              number: 8080
      - path: /
        pathType: Prefix
        backend:
          service:
            name: frontend-nginx-service
            port: 
              number: 8080
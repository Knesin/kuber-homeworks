apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: my-ingress
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
spec:
  rules:
  - host: nginx-multitool.site
    http:
      paths:
      - path: /api
        pathType: Prefix
        backend:
          service:
            name: api-multitool-service
            port: 
              number: 8080
      - path: /
        pathType: Prefix
        backend:
          service:
            name: frontend-nginx-service
            port: 
              number: 8080